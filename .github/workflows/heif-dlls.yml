name: HEIF DLLs

# IV-05: builds libheif + libde265 (LGPL, decoding only) once with vcpkg on Windows. Started by hand
# (Actions → HEIF DLLs → Run workflow), never on push. It commits the DLLs, their licences and
# VERSIONS.txt into vendor/heif/ of main itself (Alex's decision 2026-11-21: write access only for
# this manual workflow; the commit carries [skip ci]). The program loads the DLLs at run time
# (dynamic linking, LGPL allows it); the installer ships them next to iv.exe.
# Only the "libde265" feature: the default "hevc" feature pulls the x265 encoder (GPL) — not wanted.

on:
  workflow_dispatch:

permissions:
  contents: write # only to commit vendor/heif/ — this workflow never runs on push

jobs:
  build:
    name: Build heif.dll and libde265.dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with vcpkg
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          # DLLs with the MSVC runtime linked in: they load on a Windows without the Visual C++
          # Redistributable (MSVCP140.dll / VCRUNTIME140.dll), as HEIC must work out of the box.
          New-Item -ItemType Directory -Force triplets | Out-Null
          Set-Content triplets/x64-windows-static-crt.cmake @(
            "set(VCPKG_TARGET_ARCHITECTURE x64)",
            "set(VCPKG_CRT_LINKAGE static)",
            "set(VCPKG_LIBRARY_LINKAGE dynamic)"
          )
          & $vcpkg install "libheif[core,libde265]:x64-windows-static-crt" --overlay-triplets=triplets --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-crt"
          New-Item -ItemType Directory -Force out/licenses | Out-Null
          Copy-Item "$root\bin\*.dll" out/
          foreach ($pkg in Get-ChildItem "$root\share" -Directory) {
            $copyright = Join-Path $pkg.FullName "copyright"
            if (Test-Path $copyright) { Copy-Item $copyright "out/licenses/$($pkg.Name).txt" }
          }
          & $vcpkg list --x-full-desc | Out-File -Encoding utf8 out/VERSIONS.txt
          git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD | Out-File -Encoding utf8 -Append out/VERSIONS.txt
          Get-ChildItem -Recurse out
          # Show what the DLLs import: no MSVCP140 / VCRUNTIME140 may be left.
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) {
            foreach ($dll in Get-ChildItem out/*.dll) {
              $imports = & $dumpbin.FullName /dependents $dll.FullName | Select-String "\.dll"
              Write-Output "$($dll.Name) imports: $($imports -join ', ')"
              if ($imports -match "MSVCP140|VCRUNTIME140") { throw "$($dll.Name) still needs the Visual C++ runtime" }
            }
          }
          Remove-Item -Recurse -Force triplets
      - uses: actions/upload-artifact@v4
        with:
          name: heif-dlls
          path: out/
          if-no-files-found: error
      - name: Commit the DLLs into vendor/heif/
        shell: pwsh
        run: |
          $target = "vendor/heif"
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item -Recurse out/* $target
          Set-Content (Join-Path $target "SOURCES.md") @(
            "# libheif and libde265",
            "",
            "Built by the manual workflow .github/workflows/heif-dlls.yml (vcpkg, x64-windows,",
            "decoding only). Licences: licenses/ (libheif and libde265 are under the GNU LGPL 3.0).",
            "Versions and the vcpkg commit: VERSIONS.txt.",
            "",
            "Sources: https://github.com/strukturag/libheif and https://github.com/strukturag/libde265",
            "(the exact versions are the vcpkg ports listed in VERSIONS.txt)."
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $target
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output "vendor/heif is up to date"; exit 0 }
          git commit -m "IV-05: vendor libheif and libde265 DLLs [skip ci]"
          git push
