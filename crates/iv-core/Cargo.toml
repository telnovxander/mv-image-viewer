[package]
name = "iv-core"
description = "Image logic of Spiegelmond, without Tauri or GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dirs = "6"
image = { version = "0.25", default-features = false, features = ["tiff", "png"] }
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
